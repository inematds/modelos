<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0c10; --bg2:#14141b; --card:#16161e; --line:#272730;
    --txt:#e9e9ee; --mut:#9a9aa6; --amb:#E2A23B; --amb2:#f0c070; --sky:#38bdf8; --pro:#cbd5e1;
    color-scheme:dark;
  }
  body.light{
    --bg:#f6f7f9; --bg2:#eceef2; --card:#ffffff; --line:#e1e3ea;
    --txt:#1a1a22; --mut:#5b5b68; --amb:#b9791d; --amb2:#a16207; --sky:#0369a1; --pro:#b45309;
    color-scheme:light;
  }
  body.light .hero .glow{opacity:.5}
  body.light pre{background:#0e0e14;color:#d6d6e0}
  body.light pre .c{color:#8a8a98}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.65 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Sora,sans-serif;line-height:1.15;margin:0}
  a{color:var(--amb);text-decoration:none}
  code,pre{font-family:"JetBrains Mono",monospace}
  .wrap{max-width:1160px;margin:0 auto;padding:0 22px}
  .mut{color:var(--mut)} .amb{color:var(--amb)}
  .chip{display:inline-block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--amb);font-weight:600;font-family:Sora}
  nav{position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);background:rgba(12,12,16,.78);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;gap:22px;height:60px}
  nav .brand{display:flex;align-items:center;gap:8px;font-family:Sora;font-weight:800;letter-spacing:-.02em;color:var(--amb)}
  nav .brand .emoji{font-size:1.25rem}
  nav .sep{color:var(--mut);opacity:.45}
  nav .inema{color:var(--sky);font-weight:600;font-size:.88rem;font-family:Sora}
  nav .inema:hover{filter:brightness(1.15)}
  nav .pro{color:var(--pro);font-weight:600;font-size:.88rem;font-family:Sora}
  nav .pro:hover{filter:brightness(1.15)}
  nav .clubpro{display:inline-flex;align-items:center;gap:6px}
  nav .links{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:.92rem}
  nav .links a.sec{color:var(--mut)} nav .links a.sec:hover{color:var(--txt)}
  .tgl{background:var(--bg2);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem}
  .tgl:hover{border-color:var(--amb)}
  .btn{display:inline-block;background:var(--amb);color:#1a1206;font-weight:600;padding:.6em 1.05em;border-radius:10px;font-family:Sora}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
  @media(max-width:760px){nav .links a.sec{display:none}}
  .hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
  .hero .glow{position:absolute;inset:-40% -20% auto auto;width:70%;height:600px;background:radial-gradient(closest-side,rgba(226,162,59,.22),transparent 70%);pointer-events:none}
  .hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:74px 22px}
  .hero h1{font-size:clamp(2.2rem,5vw,3.5rem);font-weight:800;letter-spacing:-.025em}
  .hero p.lead{font-size:1.18rem;color:var(--mut);margin:1.1em 0 1.6em;max-width:34ch}
  .hero .cta{display:flex;gap:12px;flex-wrap:wrap}
  .hero figure{margin:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px -30px #000}
  .hero figure img{width:100%;display:block}
  @media(max-width:780px){.hero .wrap{grid-template-columns:1fr;padding:48px 22px}}
  section{padding:62px 0;border-bottom:1px solid var(--line)}
  section h2{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:800;letter-spacing:-.02em}
  section .sub{color:var(--mut);margin:.6em 0 2em;max-width:62ch}
  .grid{display:grid;gap:16px}
  .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:820px){.g3,.g4{grid-template-columns:1fr 1fr}}
  @media(max-width:540px){.g2,.g3,.g4{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  .card h3{font-size:1.05rem;margin-bottom:.4em}
  .card p{color:var(--mut);font-size:.92rem;margin:0}
  .num{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border-radius:8px;background:rgba(226,162,59,.14);color:var(--amb);font-family:Sora;font-weight:800;font-size:.9rem;margin-bottom:.7em}
  .flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  .flow span{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:.45em .9em;font-size:.85rem;font-family:Sora;font-weight:600}
  .flow .arr{color:var(--amb);border:none;background:none;padding:0 .1em}
  pre{background:#0a0a0e;border:1px solid var(--line);border-radius:12px;padding:16px 18px;overflow:auto;font-size:.86rem;line-height:1.6;color:#d6d6e0}
  pre .c{color:#6f6f7c} pre .k{color:var(--amb2)} pre .s{color:#9ece6a}
  .step{display:grid;grid-template-columns:46px 1fr;gap:16px;margin-bottom:26px}
  .step .b{width:46px;height:46px;border-radius:12px;background:var(--amb);color:#1a1206;font-family:Sora;font-weight:800;font-size:1.25rem;display:flex;align-items:center;justify-content:center}
  .step h3{font-size:1.12rem;margin-bottom:.3em}
  .step p{color:var(--mut);margin:.2em 0 .7em}
  .ex{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:680px){.ex{grid-template-columns:1fr}}
  .ex figure{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .ex figure img{width:100%;display:block}
  .ex figcaption{padding:12px 14px;font-size:.88rem;color:var(--mut);background:var(--card)}
  .phase{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
  .phase:last-child{border:none}
  .phase .tag{flex:0 0 92px;font-family:Sora;font-weight:800;color:var(--amb)}
  .phase .d strong{display:block;margin-bottom:.2em}
  .phase .d span{color:var(--mut);font-size:.92rem}
  footer{padding:46px 0;text-align:center;color:var(--mut);font-size:.9rem}
  .pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:.3em .8em;font-size:.78rem;color:var(--mut);margin:0 4px}
  /* extras modelos */
  .mcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
  .mcard h3{font-size:1.25rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .mcard .role{font-family:Sora;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;padding:.3em .7em;border-radius:999px;border:1px solid var(--line);color:var(--amb)}
  .mcard .role.out{color:var(--mut)}
  .mcard .one{font-size:1.02rem;margin:.7em 0 .4em}
  .mcard .like{color:var(--mut);font-style:italic;margin:0 0 .9em}
  .mcard ul{margin:.2em 0 .8em 1.1em;padding:0;color:var(--mut);font-size:.93rem}
  .mcard .lbl{font-family:Sora;font-weight:600;font-size:.82rem;color:var(--txt);margin-top:.6em}
  .mcard .eff{font-family:"JetBrains Mono",monospace;font-size:.82rem;color:var(--amb2)}
  .qcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;color:var(--txt)}
  .qcard:hover{border-color:var(--amb)}
  .qcard .n{font-family:Sora;font-weight:800}
  .qcard .r{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--amb);margin:.2em 0 .5em;font-family:Sora}
  .qcard .r.out{color:var(--mut)}
  .qcard p{margin:0;color:var(--mut);font-size:.9rem}
  .rule{border:1px solid var(--amb);background:rgba(226,162,59,.08);border-radius:16px;padding:24px 26px;margin-top:22px}
  .rule h3{font-size:1.3rem;margin-bottom:.4em}
  .rule p{margin:.3em 0;color:var(--txt)}
  .stack{display:grid;grid-template-columns:1fr auto;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .stack div{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card)}
  .stack div:nth-last-child(-n+2){border-bottom:none}
  .stack .m{font-family:Sora;font-weight:800;color:var(--amb);text-align:right}
  .langs a{color:var(--mut);font-family:Sora;font-weight:600;font-size:.85rem;margin:0 3px}
  .langs a.on{color:var(--amb)}
</style>
</head>
